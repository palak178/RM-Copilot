[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rm-copilot"
version = "0.0.0"
description = "Agentic AI assistant that helps a bank Relationship Manager find high-potential customers and generate personalized, compliant outreach."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RM Copilot" }]

# Core runtime deps — minimal and stable; needed from M1/M2 onward.
# Heavier / milestone-late deps live in optional groups below so each milestone
# installs only what it needs (see Dependency Review in the project summary).
dependencies = [
    "pydantic>=2.7",          # typed domain models, tool I/O schemas (M1+)
    "pydantic-settings>=2.2",  # env-driven settings, RM_COPILOT_* (M0+)
    "pyyaml>=6.0",            # parse config/scoring.yaml (M2+)
]

[project.optional-dependencies]
# Synthetic data generation (seed-time only, not required to serve).  M1
seed = ["faker>=24.0"]
# LLM client — runtime provider is Gemini (provider-agnostic via agent.llm).  M4
llm = ["google-genai>=1.0"]
# Anthropic (Claude) provider: pip install '.[anthropic]'. OpenAI remains a stub extension point.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
# Presentation adapters: Streamlit demo + rich CLI.  M5
ui = ["streamlit>=1.30", "rich>=13.0"]
# HTTP API surface (FastAPI + SSE).  M5.5
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# Developer tooling (lint, format, test, hooks). fastapi+httpx power the API tests.  M0/M5.5
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rm_copilot"]

# ----------------------------------------------------------------------------
# Tooling
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Pragmatic, high-signal rule set. Tighten as the codebase grows.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.lint.isort]
known-first-party = ["rm_copilot"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests (mocked LLM, real SQLite)",
]

[tool.coverage.run]
source = ["src/rm_copilot"]
branch = true
